[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runna-playlist"
version = "0.2.0"
description = "Build YouTube Music playlists whose tempo follows a heart-rate-zone running workout"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "garmin-fit-sdk>=21.0",
]

[project.optional-dependencies]
# Optional, unofficial YouTube Music access (likes, song radio, no quota).
ytmusic = ["ytmusicapi>=1.8"]
# Estimate BPM from Deezer's 30-second previews when no BPM is published.
analysis = ["librosa>=0.10", "soundfile>=0.12"]
dev = ["pytest>=7", "httpx>=0.27"]


[project.scripts]
runna-playlist = "runna_playlist.app:main"

[tool.setuptools.packages.find]
include = ["runna_playlist*"]

[tool.setuptools.package-data]
runna_playlist = ["static/*"]
