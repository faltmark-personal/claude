[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runnr-playlist"
version = "0.1.0"
description = "Build YouTube Music playlists that follow a heart-rate-zone workout, for syncing to a Garmin watch"
requires-python = ">=3.10"
dependencies = [
    "ytmusicapi>=1.8",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Estimate BPM from Deezer's 30-second previews when no BPM is published.
analysis = ["librosa>=0.10", "soundfile>=0.12"]
dev = ["pytest>=7"]

[project.scripts]
runnr-playlist = "runnr_playlist.cli:main"

[tool.setuptools.packages.find]
include = ["runnr_playlist*"]
